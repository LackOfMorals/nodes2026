type Channel @node(labels: "Channel") {
	hostsThreadThreads: [Thread!]! @relationship(type: "HOSTS_THREAD", direction: OUT)
	id: String!
	name: String!
	purpose: String!
}

type DiscussedInProperties @relationshipProperties {
	confidence: Float!
	createdAt: DateTime!
	evidence: String!
}

type GraphIssue @node(labels: "Issue") {
	createdAt: DateTime!
	discussedInThreads: [Thread!]! @relationship(type: "DISCUSSED_IN", direction: OUT, properties: "DiscussedInProperties")
	id: String!
	identifier: String!
	linearUrl: String!
	peopleAssignedTo: [Person!]! @relationship(type: "ASSIGNED_TO", direction: IN)
	peopleCreated: [Person!]! @relationship(type: "CREATED", direction: IN)
	priority: BigInt!
	projectsHasIssue: [GraphProject!]! @relationship(type: "HAS_ISSUE", direction: IN)
	state: String!
	title: String!
	updatedAt: DateTime!
}

type Message @node(labels: "Message") {
	channelId: String!
	peopleAuthored: [Person!]! @relationship(type: "AUTHORED", direction: IN)
	permalink: String!
	postedAt: DateTime!
	text: String!
	threadTs: String!
	threadsHasMessage: [Thread!]! @relationship(type: "HAS_MESSAGE", direction: IN)
	ts: String!
}

type Person @node(labels: "Person") {
	assignedToIssues: [GraphIssue!]! @relationship(type: "ASSIGNED_TO", direction: OUT)
	authoredMessages: [Message!]! @relationship(type: "AUTHORED", direction: OUT)
	createdIssues: [GraphIssue!]! @relationship(type: "CREATED", direction: OUT)
	email: String!
	id: String!
	linearId: String
	name: String!
	slackId: String!
}

type GraphProject @node(labels: "Project") {
	hasIssueIssues: [GraphIssue!]! @relationship(type: "HAS_ISSUE", direction: OUT)
	id: String!
	name: String!
}

type Thread @node(labels: "Thread") {
	channelId: String!
	channelsHostsThread: [Channel!]! @relationship(type: "HOSTS_THREAD", direction: IN)
	hasMessageMessages: [Message!]! @relationship(type: "HAS_MESSAGE", direction: OUT)
	issuesDiscussedIn: [GraphIssue!]! @relationship(type: "DISCUSSED_IN", direction: IN, properties: "DiscussedInProperties")
	messageCount: BigInt!
	permalink: String!
	startedAt: DateTime!
	ts: String!
}

type Query {
	searchMessagesCI(query: String!, limit: Int = 20): [Message!]! @cypher(
		statement: """
			MATCH (m:Message)
			WHERE toLower(m.text) CONTAINS toLower($query)
			WITH m ORDER BY m.postedAt DESC
			LIMIT toInteger(coalesce($limit, 20))
			RETURN m AS result
		"""
		columnName: "result"
	)
}
