"""
Full discussion context for one issue, resolved entirely from the Neo4j
knowledge graph in a single call: the issue itself (title, state,
priority, creators, assignees, link to Linear) plus every Slack thread
where the issue was discussed — with all messages in chronological
order, author names and emails, and permalinks to Slack — plus the
link evidence for each discussion thread.

Use this first when asked about a specific issue: it needs no follow-up
calls to Linear or Slack because the graph already has everything
connected. Returns an empty list when the identifier is not in the
graph.

discussionDetails carries the evidence for how each issue–thread link
was made (correlate with discussedInThreads by threadTs): explicit
mentions carry confidence 1.0 and evidence "explicit_mention".

The demo graph contains six issues, NODES-1 through NODES-6.
"""
query GetIssueDiscussionContext(
  "The Linear issue identifier, e.g. NODES-1"
  $identifier: String!
) {
  graphIssues(where: { identifier: { eq: $identifier } }, limit: 1) {
    identifier
    title
    state
    priority
    linearUrl
    createdAt
    updatedAt
    peopleCreated {
      name
      email
    }
    peopleAssignedTo {
      name
      email
    }
    discussedInThreads(sort: [{ startedAt: ASC }]) {
      ts
      startedAt
      permalink
      channelsHostsThread {
        name
      }
      hasMessageMessages(sort: [{ ts: ASC }]) {
        ts
        postedAt
        text
        permalink
        peopleAuthored {
          name
          email
        }
      }
    }
    discussionDetails {
      threadTs
      threadPermalink
      confidence
      evidence
      createdAt
    }
  }
}
