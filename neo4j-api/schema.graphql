# GraphQL schema for the NODES 2026 demo knowledge graph (Neo4j).
#
# This file is the single source of truth for the neo4j subgraph:
#   - neo4j-api parses it at startup and executes queries against it
#   - the local Cosmo Router registers the subgraph from this static
#     schema file (router/graph.yaml -> schema.file), no live
#     introspection needed
#
# Type names were chosen to avoid collisions with the Linear subgraph's
# SDL in the composed supergraph (Linear owns the name `Issue`; nothing
# here is named Issue, so the two subgraphs compose cleanly).
#
# Registered as a plain (non-federation) subgraph — the same mechanism
# that works for Linear (wgc 0.130.1; see PLAN.md Phase 4.1).

type Query {
  """
  Full discussion context for one issue, resolved entirely from the graph:
  the issue itself, who created and owns it, and every Slack thread where
  it was discussed, with all messages in chronological order. Null when
  the identifier is not in the graph.
  """
  getIssueDiscussionContext(identifier: String!): IssueDiscussionContext

  """
  Case-insensitive substring search across all discussion messages stored
  in the graph. Each hit carries the thread and channel it lives in.
  """
  searchMessages(query: String!, limit: Int = 20): [MessageSearchHit]!
}

"""An issue as stored in the graph, with its discussion context attached."""
type IssueDiscussionContext {
  identifier: String!
  title: String!
  state: String
  """Linear priority: 0 = no priority, 1 = urgent, 2 = high, 3 = medium, 4 = low."""
  priority: Int
  linearUrl: String
  createdAt: String
  updatedAt: String
  createdBy: Person
  assignedTo: Person
  discussions: [Discussion]!
}

"""A person, unified across Linear and Slack by email address."""
type Person {
  name: String
  email: String
}

"""A Slack thread where the issue was discussed, with the confidence the graph assigned the link."""
type Discussion {
  """Name of the Slack channel the thread lives in."""
  channel: String
  """Slack ts of the thread's first message."""
  threadTs: String
  startedAt: String
  permalink: String
  confidence: Float
  """How the link was established: explicit_mention (iteration 2 adds semantic_match)."""
  evidence: String
  messages: [DiscussionMessage]!
}

"""A Slack message inside a discussion thread, in chronological order."""
type DiscussionMessage {
  ts: String
  postedAt: String
  text: String
  authorName: String
  authorEmail: String
  permalink: String
}

"""A message search hit, annotated with the thread and channel it lives in."""
type MessageSearchHit {
  ts: String
  postedAt: String
  text: String
  authorName: String
  authorEmail: String
  permalink: String
  threadTs: String
  channel: String
}
